# Arbeitsablauf "Kurse laden": holt die Tageskurse und legt sie im Zweig "daten" ab.
name: Kurse laden

on:
  schedule:
    # Zeiten in UTC. 22:37 UTC = 23:37 Uhr deutscher Winterzeit, nach US-Börsenschluss.
    - cron: "37 22 * * 1-5"   # Montag bis Freitag abends
    # Zweiter Lauf am frühen Morgen als Sicherheit, vor dem Review (6:37) und dem Scan (Sa 7:43).
    - cron: "17 4 * * 2-6"    # Dienstag bis Samstag 04:17 UTC = 05:17 Uhr
  workflow_dispatch: {}       # Knopf "Run workflow" zum Starten von Hand

permissions:
  contents: write             # der Ablauf darf Dateien in dieses Repository schreiben

concurrency:
  group: kurse-laden          # nie zwei Läufe gleichzeitig
  cancel-in-progress: false

jobs:
  laden:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Dateien des Repositorys holen
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bibliotheken installieren
        run: pip install --quiet "yfinance==1.8.0" pandas   # feste Version, die am 18.11.2026 geprüft wurde

      - name: Kurse laden und Kennzahlen rechnen
        run: python kurse_laden.py --tickers tickers.csv --out out

      # Die Daten kommen in den Zweig "daten" – jedes Mal als ein einziger frischer Stand,
      # damit das Repository nicht mit alten Kursdateien anwächst.
      - name: Daten im Zweig "daten" veröffentlichen
        run: |
          cd out
          git init -q -b daten
          git config user.name "kurse-bot"
          git config user.email "kurse-bot@users.noreply.github.com"
          git add .
          git commit -q -m "Kurse, Stand $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" daten

      # Kleine Statusdatei im Hauptzweig: zeigt den Stand und hält den Zeitplan aktiv
      # (GitHub schaltet Zeitpläne in Repositorys ohne Aktivität nach 60 Tagen ab).
      - name: Status im Hauptzweig ablegen
        run: |
          cp out/status.json status.json
          git config user.name "kurse-bot"
          git config user.email "kurse-bot@users.noreply.github.com"
          git add status.json
          git commit -q -m "Status $(date -u '+%Y-%m-%d %H:%M') UTC" || echo "Status unverändert"
          git push -q
